<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop Total App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbbf24">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #fbbf24;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            padding-bottom: 220px; /* Space for fixed panel */
        }

        h1 { text-align: center; color: var(--accent); font-size: 1.2rem; margin: 10px 0; }

        .customer-list { display: flex; flex-direction: column; gap: 10px; }

        .customer-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }

        .customer-card.active {
            border-color: var(--accent);
            background: #2d3748;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-name { font-weight: bold; font-size: 1.1rem; }
        .total-display { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        .history { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; min-height: 1em; }

        /* Input Panel Logic */
        .input-panel {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            border-top: 3px solid #334155;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-panel.locked {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(1);
        }

        .input-panel.unlocked {
            border-top-color: var(--accent);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #active-label.warning { color: var(--red); animation: pulse 1.5s infinite; }

        input {
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 8px;
            border: none;
            margin-bottom: 12px;
            background: #f8fafc;
            color: #0f172a;
            box-sizing: border-box;
        }

        .button-grid { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 10px; }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
        }

        .btn-add { background: var(--green); }
        .btn-sub { background: var(--blue); }
        .btn-clear { background: var(--red); }
        
        .reset-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 0.7rem;
            text-decoration: underline;
        }

        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Multi-Customer Calculator</h1>
        <div id="customer-list" class="customer-list"></div>
        
        <div id="control-panel" class="input-panel locked">
            <div class="status-bar">
                <span id="active-label" class="warning">SELECT PERSON</span>
                <span id="active-total"></span>
            </div>
            <input type="number" id="money-input" placeholder="0" inputmode="decimal">
            <div class="button-grid">
                <button onclick="calc('add')" class="btn btn-add">ADD</button>
                <button onclick="calc('sub')" class="btn btn-sub">SUB</button>
                <button onclick="resetCurrent()" class="btn btn-clear">CLR</button>
            </div>
            <span class="reset-link" onclick="resetAll()">Reset All Data</span>
        </div>
    </div>

    <script>
        // Data Management
        let customers = JSON.parse(localStorage.getItem('shopData')) || [
            { id: 1, total: 0, history: [] },
            { id: 2, total: 0, history: [] },
            { id: 3, total: 0, history: [] },
            { id: 4, total: 0, history: [] },
            { id: 5, total: 0, history: [] }
        ];

        let activeId = null;

        function render() {
            const list = document.getElementById('customer-list');
            list.innerHTML = '';
            
            customers.forEach(c => {
                const card = document.createElement('div');
                card.className = `customer-card ${c.id === activeId ? 'active' : ''}`;
                card.onclick = () => selectPerson(c.id);
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-name">Person ${c.id}</span>
                        <span class="total-display">Rs ${c.total}</span>
                    </div>
                    <div class="history">${c.history.slice(-3).join(', ') || 'No history'}</div>
                `;
                list.appendChild(card);
            });
            
            updateUI();
            localStorage.setItem('shopData', JSON.stringify(customers));
        }

        function selectPerson(id) {
            activeId = id;
            render();
            const input = document.getElementById('money-input');
            input.focus();
            input.value = '';
        }

        function updateUI() {
            const panel = document.getElementById('control-panel');
            const label = document.getElementById('active-label');
            const totalLabel = document.getElementById('active-total');

            if (activeId === null) {
                panel.className = "input-panel locked";
                label.innerText = "⚠️ SELECT PERSON";
                label.className = "warning";
                totalLabel.innerText = "";
            } else {
                const current = customers.find(c => c.id === activeId);
                panel.className = "input-panel unlocked";
                label.innerText = `PERSON ${activeId}`;
                label.className = "";
                totalLabel.innerText = `Current: Rs ${current.total}`;
            }
        }

        function calc(type) {
            if (activeId === null) return;
            const input = document.getElementById('money-input');
            const val = parseFloat(input.value);
            
            if (isNaN(val) || val <= 0) return;

            const cust = customers.find(c => c.id === activeId);
            if (type === 'add') {
                cust.total += val;
                cust.history.push(`+${val}`);
            } else {
                cust.total -= val;
                cust.history.push(`-${val}`);
            }

            input.value = '';
            render();
            input.focus();
        }

        function resetCurrent() {
            if (activeId === null) return;
            if (confirm(`Clear Person ${activeId}?`)) {
                const cust = customers.find(c => c.id === activeId);
                cust.total = 0;
                cust.history = [];
                render();
            }
        }

        function resetAll() {
            if (confirm("Erase all shop data?")) {
                customers.forEach(c => { c.total = 0; c.history = []; });
                activeId = null;
                render();
            }
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        render();
    </script>
</body>
            </html>
